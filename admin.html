<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aadyaa Admin Panel</title>
<script src="aadyaa-config.js"></script>
<style>
:root{--ink:#071827;--text:#edf6ff;--muted:rgba(237,246,255,.7);--gold:#d4af67;--green:#1fa67a;--line:rgba(148,163,184,.2);--display:'Space Grotesk',sans-serif;--body:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#061521,var(--ink) 48%,#10283a);color:var(--text);font-family:var(--body)}.wrap{width:min(1120px,calc(100% - 40px));margin:auto;padding:52px 0}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:30px}.eyebrow{color:var(--gold);font:11px monospace;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}.eyebrow:before{content:'•';color:var(--green);margin-right:8px}h1{font:600 clamp(36px,6vw,58px)/1.05 var(--display);margin:0 0 10px}p{color:var(--muted);margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);border-radius:999px;padding:12px 16px;cursor:pointer;font:12px monospace}.btn:hover{border-color:var(--gold);color:var(--gold)}.stats{display:flex;gap:12px;margin-bottom:18px}.stat{padding:16px 20px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;min-width:130px}.stat strong{display:block;color:var(--gold);font:600 25px var(--display)}.stat span{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:rgba(8,20,30,.8)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:17px 18px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold);font:11px monospace;text-transform:uppercase;letter-spacing:.08em}td{font-size:13px}td small{display:block;color:var(--muted);margin-top:5px}.empty{text-align:center;padding:60px;color:var(--muted)}.error{color:#f3c77d;padding:14px 0;font-size:13px}@media(max-width:600px){.wrap{padding-top:30px}.top{display:block}.actions{margin-top:20px}.stats{overflow:auto}.stat{min-width:105px}}
</style>
</head>
<body>
<main class="wrap"><div class="top"><div><div class="eyebrow">Aadyaa internal view</div><h1>Lead enquiries.</h1><p>Live name, phone, package and optional add-ons.</p></div><div class="actions"><a class="btn" href="index.html">Open website</a><button class="btn" id="refreshBtn" type="button">Refresh</button></div></div><div class="stats"><div class="stat"><strong id="leadCount">0</strong><span>Total leads</span></div><div class="stat"><strong id="addonCount">0</strong><span>With add-ons</span></div></div><div class="error" id="error" hidden></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Phone</th><th>Package</th><th>Optional add-ons</th><th>Received</th></tr></thead><tbody id="leadRows"></tbody></table><div class="empty" id="emptyState">Loading enquiries...</div></div></main>
<script>
const rows=document.getElementById('leadRows');const empty=document.getElementById('emptyState');const errorBox=document.getElementById('error');
function render(leads){document.getElementById('leadCount').textContent=leads.length;document.getElementById('addonCount').textContent=leads.filter(lead=>lead['Optional Add-ons']&&lead['Optional Add-ons']!=='None selected').length;rows.innerHTML=leads.map(lead=>`<tr><td><strong>${lead.Name||''}</strong><small>${lead.Source||'website'}</small></td><td>${lead.Phone||''}</td><td>${lead.Package||''}</td><td>${lead['Optional Add-ons']||'None selected'}</td><td>${lead['Received At']||''}</td></tr>`).join('');empty.textContent=leads.length?'':'No enquiries saved yet.';empty.style.display=leads.length?'none':'block'}
async function refresh(){errorBox.hidden=true;empty.style.display='block';empty.textContent='Loading enquiries...';try{const leads=await loadAadyaaLeads();render(leads)}catch(error){empty.textContent='Unable to load enquiries.';errorBox.textContent='Configure the Google Sheets Web App URL in aadyaa-config.js.';errorBox.hidden=false}}
document.getElementById('refreshBtn').addEventListener('click',refresh);refresh();
</script>
</body>
</html>
